apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HaiXon231/mlops-platform-aws.git
    targetRevision: main
    path: deploy/gitops/inference
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: inference-api
      namespace: mlops
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
