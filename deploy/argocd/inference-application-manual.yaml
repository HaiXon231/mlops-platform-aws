apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HaiXon231/mlops-platform-aws.git
    targetRevision: main
    path: deploy/gitops/inference
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
