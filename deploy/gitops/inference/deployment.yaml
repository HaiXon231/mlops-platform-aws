apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
    mlops.aws/model-version: '1'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        mlops.aws/model-version: '1'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
        mlops.aws/release-id: m32-39825064100-1
        mlops.aws/artifact-checksum: d35626fd5e47c1e874be1cb4bb1d04278a33c07a34109cc6df2eccf6a0dcf6b3
        mlops.aws/mlflow-run-id: bb3155725d1149a8bfeefd1a9f184dbf
        mlops.aws/serving-git-sha: e2a32ec6794962ade578d4185c706d31fba153d9
    spec:
      terminationGracePeriodSeconds: 35
      nodeSelector:
        mlops.aws/workload: inference
        karpenter.sh/capacity-type: on-demand
      tolerations:
      - key: mlops.aws/workload
        operator: Equal
        value: inference
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: inference-api
        image: 160616607747.dkr.ecr.ap-southeast-1.amazonaws.com/mlops-aws-inference-dev@sha256:04be9767bd397ed88ad6ec286f16cc9c742196b359b16299985d8dd715566ab7
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
