apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-release-verify
  namespace: mlops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-release-verify
  namespace: mlops
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [inference-api]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [inference-champion]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-release-verify
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: inference-release-verify
    namespace: mlops
roleRef:
  kind: Role
  name: inference-release-verify
  apiGroup: rbac.authorization.k8s.io
