apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-api
  namespace: mlops
  annotations:
    # ALB nội bộ trong VPC, không mở ra Internet.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/inbound-cidrs: 10.20.0.0/16
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    # Argo Rollouts tự quản annotation actions.inference-api (trọng số stable/canary).
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inference-api
                port:
                  name: use-annotation
