apiVersion: batch/v1
kind: Job
metadata:
  name: inference-release-export
  namespace: mlops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    mlops.aws/release-id: m32-39808458556
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: inference-release-export
      containers:
      - name: export
        image: 160616607747.dkr.ecr.ap-southeast-1.amazonaws.com/mlops-aws-inference-dev@sha256:ca74f0fa24f2146391955271dd0f72f1f3593abae06d861a7617458549f98def
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - inference.release_s3
        args:
        - export
        - --bucket
        - mlops-aws-model-artifacts-dev-160616607747-ap-southeast-1
        - --model-name
        - nyc-taxi-trip-duration
        - --model-version
        - '1'
        - --release-id
        - m32-39808458556
        - --serving-git-sha
        - 1d3d9f81f2a6941dc15e9308292d060b6055b343
        env:
        - name: AWS_REGION
          value: ap-southeast-1
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 2Gi
