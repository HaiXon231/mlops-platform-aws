# grafana-community/grafana 14.0.1. Credentials are supplied by a Secret at deploy time.
admin:
  existingSecret: m33-grafana-admin
rbac:
  create: false
testFramework:
  enabled: false
service:
  type: ClusterIP
deploymentStrategy:
  type: Recreate
persistence:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 500m
    memory: 768Mi
    ephemeral-storage: 512Mi
nodeSelector:
  eks.amazonaws.com/nodegroup: system
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://m33-prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true
        editable: false
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: inference
        orgId: 1
        folder: MLOps
        type: file
        updateIntervalSeconds: 30
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/inference
dashboardsConfigMaps:
  inference: m33-inference-dashboard
