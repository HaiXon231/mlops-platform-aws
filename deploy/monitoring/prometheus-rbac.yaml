apiVersion: v1
kind: ServiceAccount
metadata:
  name: m33-prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: m33-inference-pod-reader
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: m33-inference-pod-reader
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: m33-prometheus
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: m33-inference-pod-reader
