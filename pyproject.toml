[project]
name = "mlops-platform-training"
version = "0.1.0"
description = "Reproducible local NYC TLC trip-duration training"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3[crt]>=1.40,<2",
  "fastapi==0.156.8",
  "lightgbm>=4.7,<5",
  "mlflow==3.6.0",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic==2.14.1",
  "psycopg2-binary==2.9.11",
  "pyarrow>=20,<24",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn==0.54.0",
]

[project.scripts]
mlops-train = "training.cli:main"
mlops-cloud = "training.cloud:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training", "src/inference"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
