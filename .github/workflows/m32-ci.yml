name: M3.2 source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0
      - run: uv sync --locked
      - run: make m31-test
      - run: uv run --locked python scripts/m31-validate-manifest.py
      - run: docker build -f deploy/release/Dockerfile -t mlops-m32-control:ci .
      - run: docker run --rm --network none mlops-m32-control:ci python -m inference.release_s3 --help
      - run: python -m compileall -q src scripts
      - run: git diff --check
