name: M3.2 approved model release
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: Approved MLflow registered model name
        required: true
        default: nyc-taxi-trip-duration
      model_version:
        description: Explicit approved Registry version
        required: true
        default: '1'
permissions:
  contents: write
  id-token: write
concurrency:
  group: m32-release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AWS_REGION: ap-southeast-1
      MODEL_NAME: ${{ inputs.model_name }}
      MODEL_VERSION: ${{ inputs.model_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0
      - name: Check immutable repository identity and explicit version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HaiXon231/mlops-platform-aws
          test "$GITHUB_REPOSITORY_ID" = 1424395869
          test "$GITHUB_REPOSITORY_OWNER_ID" = 204581707
          [[ "$MODEL_NAME" =~ ^[a-z][a-z0-9-]{1,62}$ ]]
          [[ "$MODEL_VERSION" =~ ^[1-9][0-9]*$ ]]
          test "$(git branch --show-current)" = main
      - run: uv sync --locked
      - name: Test source, bundle validation and serving manifest
        run: make m32-test
      - name: Assume scoped AWS release role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::160616607747:role/mlops-aws-dev-github-release
          aws-region: ap-southeast-1
      - name: Add only this runner IPv4 to EKS public API CIDRs
        run: python3 scripts/m32_eks_cidr.py open --state-file "$RUNNER_TEMP/m32-cidrs.json"
      - name: Export, build, deploy, verify and promote one release
        run: bash scripts/m32_release.sh
      - name: Restore exact original EKS public API CIDRs
        if: always()
        run: python3 scripts/m32_eks_cidr.py close --state-file "$RUNNER_TEMP/m32-cidrs.json"
